        extend: {

<style>
  body {
    font-feature-settings: "cv02", "cv03", "cv04", "cv11";
  }

  body.menu-open,
  body:has(dialog[open]) {
    overflow: hidden;
  }

  .custom-scroll::-webkit-scrollbar {
    height: 6px;
    width: 6px;
  }

  .custom-scroll::-webkit-scrollbar-thumb {
    background: #CBD5E1;
    border-radius: 9999px;
  }

  .donut-segment {
    transition: stroke-dasharray 0.6s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.3s ease;
    cursor: pointer;
  }

  .donut-segment:hover {
    stroke-width: 14;
  }

      input[type="number"]::-webkit-inner-spin-button,
input[type="number"]::-webkit-outer-spin-button {
  margin: 0;
  appearance: none;
}

input[type="number"] {
  appearance: textfield;
  -moz-appearance: textfield;
}

@media (max-width: 935.98px){
  #sidebar {
    transform: translateX(-100%);
    visibility: hidden;
    transition: transform 0.25s ease, visibility 0s linear 0.25s;
  }
  #sidebar.is-open {
    transform: none;
    visibility: visible;
    transition: transform 0.25s ease;
  }
}
@media (prefers-reduced-motion: reduce) {
  #sidebar { transition: none !important; }
}

.machine-card:has(.machine-open:focus-visible) {
  outline: 2px solid #00677f;
  outline-offset: 2px;
}

.cell-label {
  display: block;
  margin-bottom: 0.125rem;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: #94a3b8;
}
@media (min-width: 640px) {
  .cell-label { display: none; }
}

@media (pointer: coarse) {
  .tap { min-height: 44px; }
  .tap-square { min-height: 44px; min-width: 44px; }
  input, select, textarea { font-size: 16px !important; }
}

</style>
</head>

        <div class="space-y-8">
            <div class="border-b border-slate-100 pb-2 pt-2">

                    <h2 class="min-w-0 text-lg font-bold leading-tight text-slate-900">

                <a href="#projets" aria-current="page" class="flex items-center rounded-2xl px-4 py-3 text-sm font-semibold text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900">
                    Projets
                </a>

                <a href="#machines" class="flex items-center rounded-2xl bg-[#10203E] px-4 py-3 text-sm font-bold text-white shadow-sm transition-all">

                <a href="#consommables" class="flex items-center rounded-2xl px-4 py-3 text-sm font-semibold text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900">
                    Consommables

            </nav>
        </div>

        <div class="mt-6 border-t border-slate-100 pt-6 min-[936px]:mt-0">
            <a href="#deconnexion" class="group flex w-full items-center justify-between rounded-2xl px-4 py-3 text-sm font-semibold text-slate-600 transition-colors hover:bg-rose-50 hover:text-rose-600">
                <span>Déconnexion</span>
            </a>
        </div>

    </aside>


  <!--contenu principal -->
  <div class="flex-1 min-w-0 flex flex-col justify-between">

    <!-- menu mobile -->

        <button id="open-sidebar" type="button" aria-label="Ouvrir le menu" aria-controls="sidebar" aria-expanded="false" class="tap-square -ml-2 inline-flex h-11 w-11 items-center justify-center rounded-xl text-slate-600 transition-colors hover:bg-slate-100 hover:text-slate-900">

            <span class="material-symbols-outlined text-[24px]" aria-hidden="true">
                menu

        </button>

        <p class="text-base font-bold text-slate-900">
            Machines
        </p>

    <main class="max-w-[1400px] w-full mx-auto px-4 py-6 sm:px-6 md:py-8 ">
      <h1 class="sr-only">Machines</h1>
      <div class="flex flex-col w-full">
        <!-- recherche et filtre  -->
        <section aria-label="Rechercher une machine" class="flex flex-col gap-3 sm:flex-row sm:justify-between sm:items-center mb-6 sm:mb-8" role="search">
          <div class="relative flex w-full max-w-2xl items-center bg-surface-container-lowest rounded-full shadow-card border border-slate-200/80 px-4 py-3 sm:py-2.5">

              <option selected="">Toutes les catégories</option>
              <option>Aujourd'hui</option>
              <option>Cette semaine</option>
              <option>Ce mois-ci</option>
            </select>
          </div>
        </section>

        <!-- machines-->
        <section aria-label="Liste des machines" class="grid grid-cols-[repeat(auto-fill,minmax(min(100%,15rem),280px))] justify-center sm:justify-start items-start gap-4 sm:gap-6">
          <div class="flex w-full max-w-[280px] flex-col items-center gap-3 px-6 py-4 bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow group relative">
            <div class="w-full">
              <img alt="MAKERBOT" class="block w-full aspect-[2/3] object-cover rounded-2xl shadow-sm" loading="lazy" src="../makerbot.png">
            </div>
            <div class="w-full text-center">
              <span class="text-base text-slate-800">MAKERBOT</span>
            </div>
            <div class="w-full text-center">
              <span class="text-sm text-slate-500">Une description pour cette imprimante 3D de la marque MAKERBOT</span>
            </div>
            <div class="w-full text-center">
              <span class="text-xs text-slate-400">Impression 3D FDM</span>
            </div>
          </div>

          <div class="flex w-full max-w-[280px] flex-col items-center gap-3 px-6 py-4 bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow group relative">
            <div class="w-full">
              <img alt="TROTEC" class="block w-full aspect-[2/3] object-cover rounded-2xl shadow-sm" loading="lazy" src="../trotec.png">
            </div>
            <div class="w-full text-center">
              <span class="text-base text-slate-800">TROTEC</span>
            </div>
            <div class="w-full text-center">
              <span class="text-sm text-slate-500">Une description pour cette découpeuse laser de la marque TROTEC</span>
            </div>
            <div class="w-full text-center">
              <span class="text-xs text-slate-400">Découpe laser</span>
            </div>
          </div>

          <div class="flex w-full max-w-[280px] flex-col items-center gap-3 px-6 py-4 bg-white rounded-2xl border border-slate-200/80 shadow-sm hover:shadow-md transition-shadow group relative">
            <div class="w-full">
              <img alt="GOSCAN" class="block w-full aspect-[2/3] object-cover rounded-2xl shadow-sm" loading="lazy" src="../goscan.png">
            </div>
            <div class="w-full text-center">
              <span class="text-base text-slate-800">GOSCAN</span>
            </div>
            <div class="w-full text-center">
              <span class="text-base text-slate-800"></span>
            </div>
            <div class="w-full text-center">
              <span class="text-xs text-slate-400">Scanner</span>
            </div>
          </div>
        </section>
      </div>
    </main>
  </div>
</body>

<script>
const sidebar = document.getElementById('sidebar');
const sidebarOverlay = document.getElementById('sidebar-overlay');

const openSidebarButton = document.getElementById('open-sidebar');
const closeSidebarButton = document.getElementById('close-sidebar');

const desktopQuery = window.matchMedia('(min-width: 936px)');

const setSidebar = (open, { restoreFocus = false } = {}) => {

    sidebar.classList.toggle('is-open', open);

    sidebarOverlay.classList.toggle('hidden', !open);

    document.body.classList.toggle('menu-open', open);

    openSidebarButton.setAttribute('aria-expanded', String(open));

    if (open) {
        closeSidebarButton.focus();
    } else if (restoreFocus) {
        openSidebarButton.focus();
    }
};
openSidebarButton.addEventListener('click', () => {
    setSidebar(true);
});

closeSidebarButton.addEventListener('click', () => {
    setSidebar(false, { restoreFocus: true });
});

sidebarOverlay.addEventListener('click', () => {
    setSidebar(false, { restoreFocus: true });
});

sidebar.querySelectorAll('nav a').forEach((link) => {

    link.addEventListener('click', () => {

        if (!desktopQuery.matches) {
            setSidebar(false);
        }

    });

});

document.addEventListener('keydown', (event) => {

    if (
        event.key === 'Escape' &&
        sidebar.classList.contains('is-open')
    ) {
        setSidebar(false, { restoreFocus: true });
    }

});

desktopQuery.addEventListener('change', (event) => {

    if (event.matches) {
        setSidebar(false);
    }

});
</script>

</html>
