<!DOCTYPE html>
<html class="h-full" lang="fr">

<head>
  <meta charset="utf-8"> 
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Maquette-connexion</title>
  <link href="https://fonts.googleapis.com" rel="preconnect">
  <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              cyan: '#00B1D8',
              'cyan-hover': '#0097b9',
              navy: '#061D45',
              'navy-light': '#0b295e',
              yellow: '#FFBE00',
              surface: '#F8FAFC',
              input: '#F1F4F8',
              border: '#E2E8F0',
            }
          },
          fontFamily: {
            display: ['"Space Grotesk"', 'sans-serif'],
            sans: ['"Inter"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          borderRadius: {
            '3xl': '1.75rem',
            '4xl': '2.25rem',
          }
        }
      }
    }
  </script>
</head>


<body class="bg-tech-dots font-sans text-slate-800 min-h-screen min-h-dvh py-6 px-4 md:py-16 selection:bg-brand-cyan selection:text-white flex flex-col justify-center items-center">
  <main class="w-[80vw] max-w-[620px] sm:w-full filter drop-shadow-xl" data-purpose="login-modal">

    <div aria-label="Modes de connexion" class="flex w-full" role="tablist">
      <button aria-controls="members-panel" aria-selected="true" class="w-1/2 px-2 py-4 text-center font-display text-sm min-[380px]:text-base sm:text-lg leading-tight font-bold bg-white text-brand-navy rounded-tl-3xl border-t border-l border-brand-border justify-center transition-colors relative z-10 rounded-tr-2xl touch-manipulation focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-brand-cyan" id="members-tab" role="tab" tabindex="0" type="button">
        Membres
      </button>
      <button aria-controls="admins-panel" aria-selected="false" class="w-1/2 px-2 py-4 text-center font-display text-sm min-[380px]:text-base sm:text-lg leading-tight font-medium bg-[#EBF0F6] text-slate-500 rounded-tr-3xl border-t border-r border-l border-brand-border/60 hover:bg-[#E2E8F0] hover:text-brand-navy justify-center transition-colors relative z-0 rounded-tl-2xl touch-manipulation focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-brand-cyan" id="admins-tab" role="tab" tabindex="-1" type="button">
        Administrateurs
      </button>
    </div>

    <section class="bg-white rounded-b-3xl border-x border-b border-brand-border shadow-xl p-6 sm:p-8 md:p-12 relative z-10 -mt-px">
      <div aria-hidden="false" aria-labelledby="members-tab" id="members-panel" role="tabpanel">
        <form class="space-y-6 md:space-y-8" onsubmit="event.preventDefault()">
          <div class="space-y-3">
            <label class="block font-display text-base sm:text-lg font-semibold text-brand-navy" for="user-access-code">Code de connexion</label>
            <div class="relative">
              <input autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" class="block w-full min-w-0 h-14 pl-4 sm:pl-5 pr-12 rounded-2xl bg-brand-input border border-brand-border text-brand-navy font-mono text-base sm:text-lg tracking-wider placeholder:text-slate-400 placeholder:font-sans focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-cyan focus:border-brand-cyan transition-all" id="user-access-code" name="access_code" required="" type="password">
              <button aria-controls="user-access-code" aria-label="Afficher ou masquer le code de connexion" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center rounded-xl text-[#64748B] hover:text-brand-navy focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-cyan transition-colors cursor-pointer touch-manipulation" onclick="const input = document.getElementById('user-access-code'); input.type = input.type === 'password' ? 'text' : 'password';" type="button">
                <svg aria-hidden="true" class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="pt-2 md:pt-4 flex items-center justify-end">
            <button class="w-full sm:w-auto justify-center font-display font-semibold text-base px-8 py-3 bg-brand-navy hover:bg-brand-navy-light text-white shadow-md hover:shadow-lg transition-all duration-200 transform active:scale-95 flex items-center gap-2 border border-brand-navy rounded-2xl touch-manipulation focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-cyan focus-visible:ring-offset-2" type="submit">Connexion</button>
          </div>
        </form>
      </div>

      <div aria-hidden="true" aria-labelledby="admins-tab" class="hidden" id="admins-panel" role="tabpanel">
        <form class="space-y-5 md:space-y-6" onsubmit="event.preventDefault()">
          <div class="space-y-3">
            <label class="block font-display text-base sm:text-lg font-semibold text-brand-navy" for="admin-username-input">Nom</label>
            <input autocomplete="off" class="block w-full min-w-0 h-14 px-4 sm:px-5 rounded-2xl bg-brand-input border border-brand-border text-brand-navy text-base placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-cyan focus:border-brand-cyan transition-all" id="admin-username-input" name="admin_username" required="" type="text">
          </div>
          <div class="space-y-3">
            <label class="block font-display text-base sm:text-lg font-semibold text-brand-navy" for="admin-password-input">Mot de passe</label>
            <div class="relative">
              <input class="block w-full min-w-0 h-14 pl-4 sm:pl-5 pr-12 rounded-2xl bg-brand-input border border-brand-border text-brand-navy text-base placeholder:text-slate-400 focus:bg-white focus:outline-none focus:ring-2 focus:ring-brand-cyan focus:border-brand-cyan transition-all" id="admin-password-input" name="admin_password" required="" type="password">
              <button aria-controls="admin-password-input" aria-label="Afficher ou masquer le mot de passe" class="absolute right-2 top-1/2 -translate-y-1/2 w-10 h-10 flex items-center justify-center rounded-xl text-[#64748B] hover:text-brand-navy focus:outline-none focus-visible:ring-2 focus-visible:ring-brand-cyan transition-colors cursor-pointer touch-manipulation" onclick="const input = document.getElementById('admin-password-input'); input.type = input.type === 'password' ? 'text' : 'password';" type="button">
                <svg aria-hidden="true" class="w-5 h-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>
          <div class="pt-2 md:pt-4 flex items-center justify-end">
            <button class="w-full sm:w-auto justify-center font-display font-semibold text-base px-8 py-3 bg-brand-navy hover:bg-brand-navy-light text-white shadow-md hover:shadow-lg transition-all duration-200 transform active:scale-95 flex items-center gap-2 border border-brand-navy rounded-2xl touch-manipulation focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-brand-cyan focus-visible:ring-offset-2" type="submit">Connexion</button>
          </div>
        </form>
      </div>
    </section>
  </main>

  <script>
    const tabs = document.querySelectorAll('[role="tab"]');
    const panels = document.querySelectorAll('[role="tabpanel"]');

    function activateTab(tab) {
      tabs.forEach((currentTab) => {
        const active = currentTab === tab;
        currentTab.setAttribute('aria-selected', String(active));
        currentTab.tabIndex = active ? 0 : -1;
        currentTab.classList.toggle('font-bold', active);
        currentTab.classList.toggle('font-medium', !active);
        currentTab.classList.toggle('bg-white', active);
        currentTab.classList.toggle('text-brand-navy', active);
        currentTab.classList.toggle('bg-[#EBF0F6]', !active);
        currentTab.classList.toggle('text-slate-500', !active);
        currentTab.classList.toggle('z-10', active);
        currentTab.classList.toggle('z-0', !active);
      });

      panels.forEach((panel) => {
        const active = panel.id === tab.getAttribute('aria-controls');
        panel.classList.toggle('hidden', !active);
        panel.setAttribute('aria-hidden', String(!active));
      });
    }

    tabs.forEach((tab, index) => {
      tab.addEventListener('click', () => activateTab(tab));
      tab.addEventListener('keydown', (event) => {
        if (event.key === 'ArrowRight' || event.key === 'ArrowLeft') {
          event.preventDefault();
          const nextIndex = event.key === 'ArrowRight'
            ? (index + 1) % tabs.length
            : (index - 1 + tabs.length) % tabs.length;
          tabs[nextIndex].focus();
          activateTab(tabs[nextIndex]);
        }
      });
    });
  </script>
</body>

</html>
